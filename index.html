.ad,.adsbygoogle,iframe[src*="ads"]{display:none!important}
@media(max-width:560px){.hero h1{font-size:22px}.tr{gap:10px}}

if(S.v=="feed"){h+=(p?"":'<div class="hero"><h1>Toute l’Afrique, un seul son 🌍</h1><p>Écoute, partage et télécharge les singles de tes artistes préférés. Artiste ? Uploade ton single et fais-toi découvrir.</p><button class="btn" style="background:#fff;color:var(--sd)" onclick="auth()">Rejoindre SINGGLE</button></div>')+top10()+'<input placeholder="🔍 Rechercher un titre, un artiste, un pays…" value="'+esc(S.q)+'" oninput="S.q=this.value.toLowerCase();$(\'fl\').innerHTML=list(flt())" style="margin-bottom:12px"><div class="chips">'+["Tous"].concat(G).map(g=>'<button class="chip '+(S.g==g?"on":"")+'" onclick="S.g=\''+g.replace(/\'/g,"\\'")+'\';render()">'+g+"</button>").join("")+'</div><div id="fl">'+list(flt())+"</div>"}
if(S.v=="rank"){var r=a.sort((x,y)=>score(y)-score(x));h+='<h2>🏆 Classement des singles</h2><div class="card">'+r.map((t,i)=>'<div class="rk"><div class="n">'+(i+1)+"</div>"+cv(t.a)+'<div class="inf"><b>'+esc(t.t)+"</b><small>"+esc(t.a)+" · "+C[t.c]+" "+esc(t.c)+" · "+esc(t.g)+'</small></div><small>★ '+rt(t).a.toFixed(1)+' · ❤️ '+lc(t)+'</small><button class="pl" onclick="play(\''+t.id+'\')">▶</button></div>').join("")+"</div>"}
if(S.v=="art"){var m={};D.profiles.forEach(x=>{if(x.role=="artiste")m[x.name]={n:x.name,c:x.country,g:x.genre,k:0,p:0}});a.forEach(t=>{var x=m[t.a]=m[t.a]||{n:t.a,c:t.c,g:t.g,k:0,p:0};x.k++;x.p+=pc(t)});h+='<h2>🎤 Artistes</h2><div class="grid">'+Object.keys(m).map(k=>{var x=m[k],key=fk(x.n),fo=D.follows.filter(f=>f.key==key),me=fo.some(f=>f.uid==UID);return'<div class="card ar">'+cv(x.n)+"<b>"+esc(x.n)+"</b><div><small>"+C[x.c]+" "+esc(x.c)+'</small></div><span class="tag">'+esc(x.g)+"</span><div><small>"+x.k+" single(s) · "+x.p.toLocaleString("fr")+" vues · "+fo.length+' abonné(s)</small></div><button class="btn '+(me?"o":"")+'" style="margin-top:10px" onclick="fol(\''+key+'\')">'+(me?"Suivi ✓":"Suivre")+"</button></div>"}).join("")+"</div>"}
if(S.v=="up"&&p){h+='<h2>⬆ Uploader un single</h2><form class="card" onsubmit="return upl(event)"><label>Titre du single</label><input id="ut" required maxlength="60"><label>Genre</label><select id="ug">'+G.map(g=>"<option>"+g+"</option>").join("")+'</select><label>Fichier audio (MP3, M4A, WAV… 15 Mo max)</label><input id="uf" type="file" accept=".m4a,.mp4,.webm,.mp3,.wav,.ogg,audio/*" required><br><br><button class="btn" id="ub">Publier le single</button></form>'}
if(S.v=="me"&&p){var mt=a.filter(t=>t.uid==UID);h+='<div class="card" style="text-align:center">'+cv(p.name).replace('class="cv"','class="cv" style="margin:0 auto 10px;width:90px;height:90px;border-radius:50%;font-size:32px;background:'+col(p.name)+'"')+'<h2 style="margin:0">'+esc(p.name)+"</h2><small>"+(p.role=="artiste"?"🎤 Artiste":"🎧 Fan")+" · "+C[p.country]+" "+esc(p.country)+" · "+esc(p.genre)+'</small><p style="margin:10px 0">'+esc(p.bio||"Ajoute une bio pour compléter ton profil.")+'</p></div><form class="card" onsubmit="return pro(event)"><h3>Compléter mon profil</h3><label>Nom</label><input id="pn" value="'+esc(p.name)+'" required><label>Pays</label><select id="pc">'+Object.keys(C).map(c=>"<option"+(c==p.country?" selected":"")+">"+c+"</option>").join("")+'</select><label>Genre favori</label><select id="pg">'+G.map(g=>"<option"+(g==p.genre?" selected":"")+">"+g+"</option>").join("")+'</select><label>Bio</label><textarea id="pb2" rows="3" maxlength="200">'+esc(p.bio||"")+'</textarea><br><button class="btn">Enregistrer</button></form>'+(p.role=="artiste"?"<h2>Mes singles</h2>"+list(mt):"")}
$("m").innerHTML=(OKF?"":'<div class="card"><b>⚙ Mode démo</b><br><small>Ajoute ta config Firebase en haut du fichier pour activer les comptes, l’upload et les données partagées.</small></div>')+h}
function sched(){if(tm)return;tm=setTimeout(()=>{tm=0;var e=document.activeElement;if(e&&e.closest&&e.closest("#m")&&/INPUT|TEXTAREA|SELECT/.test(e.tagName))return;render()},200)}
function sub(n){DB.collection(n).limit(1000).onSnapshot(q=>{D[n]=q.docs.map(d=>Object.assign({_id:d.id},d.data()));sched()},e=>toast("Synchronisation interrompue"))}
function play(id){var t=find(id),au=$("au");if(S.cur==id&&!au.paused){au.pause();return}if(S.cur!=id){S.cur=id;au.src=src(t);$("pt").textContent=t.t;$("pa").textContent=t.a+" · "+t.c;if(DB&&UID&&CAN&&!D.plays.some(x=>x.tid==id&&x.uid==UID))DB.doc("plays/"+id+"_"+UID).set({tid:id,uid:UID}).catch(()=>{})}au.play().catch(()=>toast("Lecture impossible pour ce fichier"))}
$("au").onplay=$("au").onpause=function(){$("pp").textContent=$("au").paused?"▶":"❚❚";sched()};
$("au").ontimeupdate=function(){var a=$("au");$("pf").style.width=(a.duration?a.currentTime/a.duration*100:0)+"%"};
$("pb").onclick=function(e){var a=$("au");if(a.duration)a.currentTime=e.offsetX/this.offsetWidth*a.duration};
$("pp").onclick=function(){if(S.cur==null)play("d0");else{var a=$("au");a.paused?a.play():a.pause()}};
function like(id){if(!needP())return;var d=DB.doc("likes/"+id+"_"+UID);(mine(id)?d.delete():d.set({tid:id,uid:UID})).catch(fail)}
function tg(id){S.open[id]=!S.open[id];$("c"+id).style.display=S.open[id]?"block":"none"}
function cmt(e,id){e.preventDefault();var i=e.target.querySelector("input"),v=i.value.trim();if(!v||!needP())return false;S.open[id]=true;DB.collection("comments").add({tid:id,uid:UID,name:prof().name,text:v,ts:Date.now()}).then(()=>{i.value=""}).catch(fail);return false}
function share(id){var t=find(id),tx=t.t+" – "+t.a+" sur SINGGLE";if(navigator.share){navigator.share({title:"SINGGLE",text:tx}).catch(()=>{})}else{try{navigator.clipboard.writeText(tx);toast("Texte copié ✓")}catch(e){toast(tx)}}}
function dl(id){var t=find(id),a=document.createElement("a");a.href=src(t);a.download=(t.t||"single")+(t.demo?".wav":"");a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();toast("Téléchargement lancé ⬇")}
function fol(key){if(!needP())return;var d=DB.doc("follows/"+key+"_"+UID),me=D.follows.some(f=>f.key==key&&f.uid==UID);(me?d.delete():d.set({key:key,uid:UID})).catch(fail)}
function auth(m){if(!OKF){toast("Ajoute d’abord ta config Firebase (voir le guide)");return}mode=m||"up";role="fan";var up=mode=="up";$("mc").innerHTML='<h2>'+(up?"Créer mon compte":"Connexion")+'</h2><form onsubmit="return reg(event)"><label>E-mail</label><input id="re" type="email" required><label>Mot de passe (6 caractères min.)</label><input id="rp" type="password" minlength="6" required>'+(up?'<div class="seg" style="margin-top:12px"><button type="button" class="on" id="rf" onclick="sr(\'fan\')">🎧 Fan</button><button type="button" id="ra" onclick="sr(\'artiste\')">🎤 Artiste</button></div><label>Nom / nom d’artiste</label><input id="rn" required maxlength="40"><label>Pays</label><select id="rc">'+Object.keys(C).map(c=>"<option>"+c+"</option>").join("")+'</select><label>Genre préféré</label><select id="rg">'+G.map(g=>"<option>"+g+"</option>").join("")+'</select><label>Bio (facultatif)</label><textarea id="rb" rows="2" maxlength="200"></textarea>':"")+'<br><button class="btn" style="width:100%">'+(up?"Rejoindre SINGGLE":"Se connecter")+'</button><br><br><button type="button" class="btn o" style="width:100%" onclick="auth(\''+(up?"in":"up")+'\')">'+(up?"J’ai déjà un compte":"Créer un compte")+'</button><br><br><button type="button" class="btn o" style="width:100%" onclick="cl()">Annuler</button></form>';$("md").className="modal on"}
function sr(r){role=r;$("rf").className=r=="fan"?"on":"";$("ra").className=r=="artiste"?"on":""}
function cl(){$("md").className="modal"}
function fe(e){var c=(e&&e.code)||"";toast(c.indexOf("email-already")>-1?"Cet e-mail est déjà utilisé":/invalid|wrong|user-not/.test(c)?"E-mail ou mot de passe incorrect":c.indexOf("weak")>-1?"Mot de passe trop faible":"Erreur : "+c)}
function reg(e){e.preventDefault();var em=$("re").value,pw=$("rp").value;if(mode=="in"){AUTH.login(em,pw).then(()=>{cl();toast("Connecté ✓")}).catch(fe);return false}AUTH.signup(em,pw).then(r=>DB.doc("profiles/"+r.user.uid).set({name:$("rn").value.trim(),role:role,country:$("rc").value,genre:$("rg").value,bio:$("rb").value})).then(()=>{cl();toast("Compte créé ✓")}).catch(fe);return false}
function out(){AUTH.out().then(()=>{S.v="feed";render()})}
function pro(e){e.preventDefault();DB.doc("profiles/"+UID).update({name:$("pn").value.trim(),country:$("pc").value,genre:$("pg").value,bio:$("pb2").value}).then(()=>toast("Profil mis à jour ✓")).catch(fail);return false}
function upl(e){e.preventDefault();var f=$("uf").files[0],p=prof();if(!f||!needP())return false;if(f.size>15*1048576){toast("Fichier trop lourd (15 Mo max)");return false}$("ub").textContent="Envoi…";var x=(f.name.split(".").pop()||"mp3").toLowerCase();ASSETS.upload(f).then(u=>DB.collection("tracks").add({t:$("ut").value.trim(),a:p.name,uid:UID,c:p.country,g:$("ug").value,aid:u,ext:x,ts:Date.now()})).then(()=>{S.v="feed";S.g="Tous";toast("Single publié 🎉");render()}).catch(er=>{$("ub").textContent="Publier le single";toast("Erreur d’envoi : "+((er&&er.code)||"réessaie"))});return false}
render();
Object.assign(window,{rate,go,play,like,tg,cmt,share,dl,fol,auth,sr,cl,reg,pro,upl,out,render,list,flt,S,$});
OKF=CFG.apiKey!=="VOTRE_API_KEY";
if(OKF){try{
const app=initializeApp(CFG),A=getAuth(app),F=getFirestore(app),ST=getStorage(app);
DB={doc:p=>({set:d=>setDoc(doc(F,p),d),update:d=>updateDoc(doc(F,p),d),delete:()=>deleteDoc(doc(F,p))}),collection:n=>({add:d=>addDoc(collection(F,n),d),limit:k=>({onSnapshot:(f,e)=>onSnapshot(query(collection(F,n),limit(k)),f,e)})})};
ASSETS={upload:f=>{var nm=Date.now()+"_"+f.name.replace(/[^\w.\-]/g,"_"),r=ref(ST,"tracks/"+UID+"/"+nm);return uploadBytes(r,f,{contentType:f.type||"audio/mpeg",contentDisposition:'attachment; filename="'+nm+'"'}).then(()=>getDownloadURL(r))}};
AUTH={signup:(e,p)=>createUserWithEmailAndPassword(A,e,p),login:(e,p)=>signInWithEmailAndPassword(A,e,p),out:()=>signOut(A)};
onAuthStateChanged(A,u=>{UID=u?u.uid:null;render()});
["profiles","tracks","likes","comments","follows","plays","ratings"].forEach(sub);
}catch(e){OKF=false;toast("Config Firebase invalide")}}
render();
</script>
</body>
</html>
